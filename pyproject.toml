[project]
name = "docintake"
version = "0.1.0"
description = "Accounts payable intake: extract invoices, check them in code, review side by side, post to QuickBooks or Xero"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "fastapi", "httpx", "python-multipart"]
live = ["fastapi", "uvicorn", "python-multipart", "pypdf>=4", "anthropic>=1,<2"]

[tool.setuptools]
packages = ["docintake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
